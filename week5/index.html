<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>미니 쇼핑몰</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>MINI SHOP</h1>
        <nav>
            <a href="#banner">홈</a>
            <a href="#products">상품 목록</a>
        </nav>
        <span>장바구니 (0)</span>
    </header>

    <main>
        <section id="banner">
            <h2>당신의 하루를 빛내줄</h2>
            <p>미니 쇼핑몰에서 마음에 드는 상품을 만나보세요.</p>
        </section>

        <section id="products">
            <h2>상품 목록</h2>
            <div class="product-list">
                <div class="product">
                    <span class="badge">SALE</span>
                    <h3>맨유 티셔츠</h3>
                    <p>맨유 24/25 홈 저지</p>
                    <p>55,000원</p>
                </div>
                <div class="product">
                    <span class="badge">NEW</span>
                    <h3>캔버스 에코백</h3>
                    <p>가볍게 들고 다니는 에코백</p>
                    <p>12,000원</p>
                </div>
                <div class="product">
                    <span class="badge">NEW</span>
                    <h3>데일리 머그컵</h3>
                    <p>매일 사용하는 머그컵</p>
                    <p>8,000원</p>
                </div>
                <div class="product">
                    <span class="badge">SALE</span>
                    <h3>스프링 노트</h3>
                    <p>생각을 기록하는 노트</p>
                    <p>3,000원</p>
                </div>
                <div class="product">
                    <span class="badge">NEW</span>
                    <h3>코튼 양말</h3>
                    <p>부드러운 기본 양말</p>
                    <p>4,000원</p>
                </div>
                <div class="product">
                    <span class="badge">SALE</span>
                    <h3>미니 파우치</h3>
                    <p>작은 소지품을 담는 파우치</p>
                    <p>6,000원</p>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
