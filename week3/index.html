<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>김재환에게 문의하기</title>
    <meta name="description" content="제주대학교 컴퓨터공학전공 김재환의 프로필과 문의 양식을 소개하는 페이지입니다." />
    <meta property="og:title" content="김재환에게 문의하기">
    <meta property="og:description" content="김재환의 프로필을 확인하고 문의를 남길 수 있는 페이지입니다.">
    <meta property="og:url" content="https://rlawhh.github.io/web-practice-2026/week3/">
</head>
<body>
    <header>
        <h1>김재환에게 문의하기</h1>
        <p>안녕하세요. 궁금한 점이나 의견을 남겨 주세요.</p>
    </header>

    <main>
        <section>
            <h2>프로필</h2>
            <img src="profile.png" alt="프로필을 나타내는 단순한 사람 모양 아이콘" width="120" height="120">
            <p>제주대학교 컴퓨터공학전공에 재학 중인 김재환입니다.</p>
        </section>

        <section>
            <h2>문의하기</h2>
            <form>
                <p>
                    <label for="name">이름:</label>
                    <input type="text" id="name" name="name" required>
                </p>
                <p>
                    <label for="email">이메일:</label>
                    <input type="email" id="email" name="email" required>
                </p>
                <p>
                    <label for="inquiry-type">문의 유형:</label>
                    <select id="inquiry-type" name="inquiry-type" required>
                        <option value="" selected disabled>문의 유형을 선택하세요</option>
                        <option value="question">질문</option>
                        <option value="suggestion">의견</option>
                        <option value="etc">기타</option>
                    </select>
                </p>
                <p>
                    <label for="message">문의 내용:</label><br>
                    <textarea id="message" name="message" rows="5" cols="40" required></textarea>
                </p>
                <button type="submit">보내기</button>
            </form>
        </section>
    </main>

    <footer>
        <p>Copyright &copy; 2026 김재환</p>
        <p>이메일: <a href="mailto:contact@example.com">contact@example.com (예시)</a></p>
    </footer>
</body>
</html>
